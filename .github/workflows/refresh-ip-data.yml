name: Refresh IP data

# Loads the IPinfo Lite IP->organization database into the analytics bucket,
# where the Glue table `ip_ranges` reads it (see infrastructure/lib/visitor-analytics.ts).
#
# Why a workflow and not CDK: fetching a third-party file at deploy time needs a
# custom resource, which means Lambda, which LZA's `DenyLambdaWithoutVPC` SCP
# blocks outside a VPC. There is no VPC in this account, and adding one purely
# for this would mean a NAT Gateway (~$32/mo) for a job that runs 12x a year.
# So CDK owns every AWS *resource*; this workflow only moves *data*.
#
# The database is NOT committed to the repo: it is large, and redistributing
# IPinfo's data publicly would likely breach their licence.
#
# Stage mapping (same as the deploy workflows):
#   scheduled run (default branch) → prod
#   workflow_dispatch             → the chosen stage

on:
  schedule:
    # 06:00 UTC on the 1st of each month. IPinfo Lite updates daily, but the
    # ASN->organization mapping this uses moves slowly.
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      stage:
        description: 'Target stage'
        required: true
        type: choice
        options: [dev, prod]

permissions:
  id-token: write      # for OIDC
  contents: read

concurrency:
  group: ip-data-${{ github.event.inputs.stage || github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Download · Verify · Upload
    runs-on: ubuntu-latest
    # `environment:` is REQUIRED, not cosmetic. The OIDC trust policy on
    # cv-website-github-actions matches on `repo:ORG/REPO:environment:NAME`;
    # a job without an environment gets a `ref:` subject and cannot assume
    # the role. See infrastructure/lib/github-oidc-stack.ts.
    environment: ${{ (github.event.inputs.stage == 'prod' || github.ref == 'refs/heads/main') && 'production' || 'dev' }}
    env:
      STAGE: ${{ github.event.inputs.stage || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/cv-website-github-actions
          aws-region: us-east-1

      - name: Resolve target bucket from CDK stack outputs
        id: stack
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "CvWebsite-${STAGE}" \
            --query 'Stacks[0].Outputs[?OutputKey==`LogBucketName`].OutputValue' \
            --output text)
          if [ -z "$BUCKET" ] || [ "$BUCKET" = "None" ]; then
            echo "CvWebsite-${STAGE} has no LogBucketName output — deploy the infra stack first." >&2
            exit 1
          fi
          echo "bucket=$BUCKET" >> $GITHUB_OUTPUT
          echo "Target bucket: $BUCKET"

      - name: Download IPinfo Lite
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: |
          if [ -z "$IPINFO_TOKEN" ]; then
            echo "IPINFO_TOKEN secret is not set. Create a free token at https://ipinfo.io/signup" >&2
            exit 1
          fi
          # Single source of truth for the URL is cdk.json, so a fork edits one file.
          URL=$(jq -r '.context.ipinfoDatasetUrl' infrastructure/cdk.json)
          echo "Fetching $URL"
          # IPinfo's database endpoint authenticates via a ?token= query param.
          # Passed with --url-query so the token never lands in the echoed URL;
          # Actions also masks the secret in logs.
          curl -sSfL --retry 3 --retry-delay 5 \
            --url-query "token=${IPINFO_TOKEN}" \
            -o ipinfo_lite.csv.gz \
            "$URL"

      # Guard against overwriting good data with an error page or a truncated
      # download. Also asserts the column order the Glue table depends on:
      # OpenCSVSerde maps purely by position, so a silent upstream reordering
      # would put as_name in the country column with no error anywhere.
      - name: Verify download
        run: |
          set -euo pipefail
          gzip -t ipinfo_lite.csv.gz
          HEADER=$(gunzip -c ipinfo_lite.csv.gz | head -1 | tr -d '\r')
          EXPECTED='network,country,country_code,continent,continent_code,asn,as_name,as_domain'
          if [ "$HEADER" != "$EXPECTED" ]; then
            echo "Unexpected IPinfo Lite schema." >&2
            echo "  expected: $EXPECTED" >&2
            echo "  actual:   $HEADER" >&2
            echo "Update the ip_ranges table columns in infrastructure/lib/visitor-analytics.ts to match." >&2
            exit 1
          fi
          ROWS=$(gunzip -c ipinfo_lite.csv.gz | wc -l)
          if [ "$ROWS" -lt 100000 ]; then
            echo "Only $ROWS rows — expected millions. Refusing to publish a truncated file." >&2
            exit 1
          fi
          echo "OK: $ROWS rows, schema matches."

      # Fixed object name so each run REPLACES the previous database. A varying
      # name would leave both files under the prefix and Athena would read the
      # union, double-counting every range.
      #
      # --sse AES256 is mandatory: the LZA InfrastructureProtection-SCP denies
      # any PutObject without the encryption header.
      - name: Upload to S3
        run: |
          aws s3 cp ipinfo_lite.csv.gz \
            "s3://${{ steps.stack.outputs.bucket }}/enrichment/ipinfo-lite/ipinfo_lite.csv.gz" \
            --sse AES256
          echo "::notice::✅ IP database refreshed for ${STAGE}"
