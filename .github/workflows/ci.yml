name: CI

# Validates pull requests without touching AWS — the "does it still build?" gate.
# Runs the same install + build/synth steps as the deploy workflows, minus the
# credentialed deploy stages, so Dependabot's PRs (and any other PR) get checked
# before they're merged into dev.
#
# This is the prerequisite for auto-merge: if auto-merge is ever added, make the
# `frontend` and `infrastructure` jobs below REQUIRED status checks on dev so
# `gh pr merge --auto` waits for them. (Not enabled today — the repo uses a
# direct-push dev→main flow, and a required check would block those pushes.)

on:
  pull_request:
    branches: [dev, main]

# Read-only: this workflow never needs to write to the repo or assume AWS roles.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      # Full build incl. the prebuild hook (image optimize + resume PDF), same as
      # deploy-site.yml. The analytics token isn't needed to validate the build.
      - name: Build Next.js static export
        working-directory: frontend
        run: npm run build

  infrastructure:
    name: Synth infrastructure
    runs-on: ubuntu-latest
    env:
      # `bin/infrastructure.ts` throws without an account id, since it is
      # deliberately not in cdk.json (public repo). Synth does not talk to AWS,
      # so any syntactically valid id works, and the fallback keeps CI green in
      # a fork that has not set the variable.
      CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID || '000000000000' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infrastructure/package-lock.json

      - name: Install CDK deps
        working-directory: infrastructure
        run: npm ci

      # `cdk synth` needs no AWS credentials — it just compiles the stacks and
      # renders CloudFormation, which catches type errors and lib/CLI schema
      # mismatches (exactly the aws-cdk-lib vs aws-cdk CLI drift kind).
      - name: CDK synth
        working-directory: infrastructure
        run: npx cdk synth

      # Synth-time guards for the failure modes that are otherwise invisible
      # until production breaks: an origin reordering stripping OAC (the whole
      # site becomes /404.html), or a Lambda-backed custom resource that LZA's
      # DenyLambdaWithoutVPC rejects at deploy rather than at synth.
      # esbuild does not type-check, so the Lambda bundle is checked separately
      # against lambda/tsconfig.json (bundler resolution, reaches into frontend/).
      - name: Typecheck chat Lambda
        working-directory: infrastructure
        run: npm run typecheck:lambda

      - name: Assert stack invariants
        working-directory: infrastructure
        run: npm test

      # The repo gate, which also covers the artifact invariants that have each
      # regressed at least once: resume page count, no em dashes, no leaked
      # comments in the published Markdown, no HTML comments left in knowledge/,
      # retrieval still separating broad from narrow queries, and no customer or
      # colleague name in published prose. Needs the frontend's deps too.
      - name: Install frontend deps for the gate
        working-directory: frontend
        run: npm ci

      # pdfinfo/pdftotext are not on ubuntu-latest. Without them the two resume
      # checks skip rather than fail, which would quietly mean no CI coverage of
      # the page count or the em-dash rule.
      - name: Install poppler-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Repo gate
        run: ./scripts/check.sh
